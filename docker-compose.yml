# ports should be removed when commiting this file.
# they will be overriden using docker-compose.override.yml
#

name: heat-loss-jsapp-fullstack-in-several-container
services:
  mysql:
    container_name: mysqlContainer
    image: mysql:8.0.42
    restart: always
    env_file:
      - ./backend/.env.container
    ports:
      - 3307:3306
    volumes:
      - heatloss_js_app_mysql_data:/var/lib/mysql
      - ./db/init/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      # timeout: 20s
      # retries: 

  backend:
    env_file:
      - ./backend/.env.container
    build:
      context: ./backend
    volumes:
      - ./backend:/heatLossApp/backend
      - backend_node_modules:/heatLossApp/backend/node_modules
    ports:
      - 4001:4001
      - 9229:9229
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    env_file: ./frontend/.env
    build:
      context: ./frontend
    ports:
      - 3000:3000
    volumes:
      - ./frontend:/heatLossApp/frontend
      - frontend_node_modules:/heatLossApp/frontend/node_modules
  # phpmyadmin:
  #   container_name: phpmyAdminContainer
  #   image: phpmyadmin:5.2.2
  #   env_file:
  #     - ./backend/.env.container
  #   ports:
  #     - 8080:80
  #   depends_on:
  #     - mysql

volumes:
  heatloss_js_app_mysql_data:
  backend_node_modules:
  frontend_node_modules:


networks:
  default:
    name: heat-loss-jsapp-network
