name: mysql-server-in-docker
services:
  mysql:
    container_name: mysqlContainer
    image: mysql:8.0.42
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - 3306:3306
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
